services:
  postgres:
    image: postgres:16-alpine
    container_name: headscale-mgmt-postgres
    environment:
      POSTGRES_DB: headscale_mgmt
      POSTGRES_USER: headscale
      POSTGRES_PASSWORD: headscale
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U headscale -d headscale_mgmt"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
